name: 'Create reminder from comment'

permissions:
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created, edited]

jobs:
  reminder:
    if: github.repository == 'roundcube/roundcubemail-docker'
    runs-on: ubuntu-latest

    steps:
      - name: 👀 check for reminder
        uses: agrc/create-reminder-action@e694d5c2c66a34319815e61df43759d25da68d70 # v1.1.27
