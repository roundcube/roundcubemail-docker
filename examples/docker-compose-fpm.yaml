# This is an example of running Roundcube, PostgreSQL, and nginx in
# containers and exposing the HTTP site on port 9009.

services:
  roundcubemail:
    image: roundcube/roundcubemail:latest-fpm
    container_name: roundcubemail
    # restart: unless-stopped
    depends_on:
      - roundcubedb
    links:
      - roundcubedb
    volumes:
      - roundcube-document-root:/var/www/html/public_html/
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=tls://mail.example.org
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail.example.org
      - ROUNDCUBEMAIL_DB_TYPE=pgsql
      - ROUNDCUBEMAIL_DB_HOST=roundcubedb # same as postgres container name
      - ROUNDCUBEMAIL_DB_USER=roundcube # same as postgres POSTGRES_USER env name
      - ROUNDCUBEMAIL_DB_PASSWORD=roundcube # same as postgres POSTGRES_PASSWORD env name
      - ROUNDCUBEMAIL_DB_NAME=roundcube # same as postgres POSTGRES_DB env name

  roundcubedb:
    image: postgres:latest
    container_name: roundcubedb
    # restart: unless-stopped
    volumes:
      - ./db/postgres:/var/lib/postgresql # for postgres versions <18 use /var/lib/postgresql/data
    environment:
      - POSTGRES_DB=roundcube
      - POSTGRES_USER=roundcube
      - POSTGRES_PASSWORD=roundcube

  roundcubenginx:
    image: nginx:latest
    container_name: roundcubenginx
    # restart: unless-stopped
    ports:
      - 9009:80
    depends_on:
      - roundcubemail
    links:
      - roundcubemail
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - roundcube-document-root:/var/www/html/public_html/
    environment:
      - NGINX_HOST=localhost  # set your local domain or your live domain
      - NGINX_PHP_CGI=roundcubemail:9000  # same as roundcubemail container name

### Optional: add a full mail server stack to use with Roundcube like https://hub.docker.com/r/tvial/docker-mailserver
#   mailserver:
#     image: tvial/docker-mailserver:latest
#     hostname: mail.example.org
#     ...  # for more options see https://github.com/tomav/docker-mailserver#examples
