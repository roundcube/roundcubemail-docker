# This is an example of running Roundcube, PostgreSQL and Caddy in Alpine-based
# containers and exposing the Roundcube site over HTTPS via Caddy.
#
# This example is based on the docker-compose-fpm.yml example but adds the
# following changes:
#
# * Uses Apline-based images
# * SSL/TLS is used for the IMAP and SMTP servers
# * Roundcube's document root is only mounted inside the containers
# * Caddy exposes the Roundcube site over HTTPS with self-signed certificates
#
# WARNING: This is a very insecure configuration and should only be used as
# as basic guidance for setting up a production site.


services:
  roundcubemail:
    image: roundcube/roundcubemail:latest-fpm-alpine
    container_name: roundcubemail
    # restart: unless-stopped
    ports:
      - 9000:9000
    volumes:
      - roundcube-document-root:/var/www/html/public_html/
    depends_on:
      - roundcubedb
    links:
      - roundcubedb
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://mail.example.org # IMAPS on port 993
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail.example.org # SMTP using STARTTLS on port 25
      - ROUNDCUBEMAIL_SMTP_PORT=25
      - ROUNDCUBEMAIL_DB_TYPE=pgsql
      - ROUNDCUBEMAIL_DB_HOST=roundcubedb # same as postgres container name
      - ROUNDCUBEMAIL_DB_USER=roundcube # same as postgres POSTGRES_USER env name
      - ROUNDCUBEMAIL_DB_PASSWORD=roundcube # same as postgres POSTGRES_PASSWORD env name
      - ROUNDCUBEMAIL_DB_NAME=roundcube # same as postgres POSTGRES_DB env name

  roundcubedb:
    image: postgres:alpine
    container_name: roundcubedb
    # restart: unless-stopped
    volumes:
      - ./db/postgres:/var/lib/postgresql # for postgres versions <18 use /var/lib/postgresql/data
    environment:
      - POSTGRES_DB=roundcube
      - POSTGRES_USER=roundcube
      - POSTGRES_PASSWORD=roundcube

  roundcubecaddy:
    image: caddy:latest
    container_name: roundcubecaddy
    # restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy
      - roundcube-document-root:/srv

volumes:
  roundcube-document-root:
