# This is an example of running Roundcube and PostgreSQL in containers
# and exposing the FastCGI Process Manager (FPM) endpoint on the Docker
# host on port 9000.  This is suitable when you already have an external
# webserver that can implement a reverse proxy to FastCGI.
#
# The external web server needs information about Roundcube's public
# files in order to serve them, so the Roundcube container's
# /var/www/html/public_html/ directory needs to be made available to
# the web server. In this example, the /var/www/htdocs/webmail.example.org/
# volume on the Docker host is mounted to /var/www/html/public_html/
# in the Roundcube container.  The web server's document root should be
# set to /var/www/htdocs/webmail.example.org/.  The web server's reverse
# proxy should point at localhost:9000/var/www/html/public_html/.
#
# Example web server configuration snippets:
#
# APACHE:
#
# DocumentRoot "/var/www/htdocs/webmail.example.org/"
# DirectoryIndex index.php
# ProxyPassMatch "^/.*\.php(/.*)?$" "fcgi://127.0.0.1:9000/var/www/html/public_html/"
#
# NGINX:
#
# root /var/www/htdocs/webmail.example.org/
# location ~ ^(.+\.php)(.*)$ {
#     fastcgi_index index.php;
#     fastcgi_split_path_info ^(.+\.php)(.*)$;
#     fastcgi_pass 127.0.0.1:9000;
#     include fastcgi_params;
#     fastcgi_param SCRIPT_FILENAME /var/www/html/public_html/$fastcgi_script_name;
#     fastcgi_param PATH_INFO $fastcgi_path_info;
# }


services:
  roundcubemail:
    image: roundcube/roundcubemail:latest-fpm
    container_name: roundcubemail
    # restart: unless-stopped
    ports:
      - 9000:9000
    volumes:
      # Change "/var/www/htdocs/webmail.example.org/" to wherever you want
      # the site's document root to be. Modify the web server config to match.
      # If using a nonroot image, the volume and the files in it must be
      # writable by the nonroot UID (82 for alpine, 33 for others).
      - /var/www/htdocs/webmail.example.org/:/var/www/html/public_html/
    depends_on:
      - roundcubedb
    links:
      - roundcubedb
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=mail.example.org
      - ROUNDCUBEMAIL_SMTP_SERVER=mail.example.org
      - ROUNDCUBEMAIL_DB_TYPE=pgsql
      - ROUNDCUBEMAIL_DB_HOST=roundcubedb # same as postgres container name
      - ROUNDCUBEMAIL_DB_USER=roundcube # same as postgres POSTGRES_USER env name
      - ROUNDCUBEMAIL_DB_PASSWORD=roundcube # same as postgres POSTGRES_PASSWORD env name
      - ROUNDCUBEMAIL_DB_NAME=roundcube # same as postgres POSTGRES_DB env name

  roundcubedb:
    image: postgres:alpine
    container_name: roundcubedb
    # restart: unless-stopped
    volumes:
      - ./db/postgres:/var/lib/postgresql # for postgres versions <18 use /var/lib/postgresql/data
    environment:
      - POSTGRES_DB=roundcube
      - POSTGRES_USER=roundcube
      - POSTGRES_PASSWORD=roundcube
